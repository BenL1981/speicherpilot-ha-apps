---
name: "SpeicherPilot EV-Brücke"
version: "1.0.0"
slug: speicherpilot_ev_bruecke
# Fertiges, in GitHub Actions gebautes und geprüftes Image (HA baut nicht selbst).
image: ghcr.io/benl1981/{arch}-speicherpilot_ev_bruecke
description: "Setzt den EV-Ladeplan über EVCC um (14-A-Kreis, Reserve-Freigaben, Notstopp)"
url: https://github.com/BenL1981/speicherpilot-ha-apps
arch:
  - aarch64
  - amd64
init: false
startup: application
# Erst nach der Umstellung auf "auto" setzen (sonst laufen alte und neue Instanz doppelt).
boot: manual
homeassistant_api: true
# Supervisor-Watchdog: Container neu starten, wenn AppDaemon nicht mehr antwortet
# oder der Herzschlag-Wächter den Container gestoppt hat.
watchdog: "tcp://[HOST]:[PORT:5050]"
map:
  - addon_config:rw
options:
  system_packages: []
  python_packages: []
  init_commands: []
  herzschlag: ["sensor.speicherpilot_2_ev_bruecke|5"]
  herzschlag_anlauf_min: 5
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  system_packages:
    - str
  python_packages:
    - str
  init_commands:
    - str
  herzschlag:
    - str
  herzschlag_anlauf_min: int(5,120)
