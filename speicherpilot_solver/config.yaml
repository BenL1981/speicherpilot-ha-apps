---
name: "SpeicherPilot inkl. EV-Solver"
version: "1.3.4"
breaking_versions: ["1.2.0"]
slug: speicherpilot_solver
# Fertiges, in GitHub Actions gebautes und geprüftes Image (HA baut nicht selbst).
image: ghcr.io/benl1981/{arch}-speicherpilot_solver
description: "Speicherplanung (Zendure, SENEC) und EV-Ladeplanung, Solver mit HiGHS"
url: https://github.com/BenL1981/speicherpilot-ha-apps
arch:
  - aarch64
  - amd64
init: false
startup: application
# Erst nach der Umstellung auf "auto" setzen (sonst laufen alte und neue Instanz doppelt).
boot: manual
homeassistant_api: true
# Supervisor-Watchdog: Container neu starten, wenn AppDaemon nicht mehr antwortet
# oder der Herzschlag-Wächter den Container gestoppt hat.
watchdog: "tcp://[HOST]:[PORT:5050]"
map:
  - addon_config:rw
options:
  system_packages: []
  python_packages: []
  init_commands: []
  herzschlag: ["sensor.speicherpilot_2_letzter_lauf|20"]
  herzschlag_anlauf_min: 15
  # 1.1.0: Zustand aller Apps im Container (speicherpilot_waechter) - abgestürzte App oder hängender Thread
  zustand: sensor.speicherpilot_solver_zustand
  anzeige_name: "SpeicherPilot inkl. EV-Solver"
  # 1.1.0: nach neustart_max automatischen Neustarts in eskalation_fenster_min kein weiterer Neustart,
  # sondern Push an benachrichtigung (z. B. notify.mobile_app_<gerät>; leer = nur Protokoll)
  benachrichtigung: ""
  neustart_max: 2
  eskalation_fenster_min: 60
  ha_ausfall_melden: false
schema:
  app_configuration: str?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  system_packages:
    - str
  python_packages:
    - str
  init_commands:
    - str
  herzschlag:
    - str
  herzschlag_anlauf_min: int(5,120)
  zustand: str?
  anzeige_name: str?
  benachrichtigung: str?
  neustart_max: int(1,5)?
  eskalation_fenster_min: int(15,240)?
  ha_ausfall_melden: bool?

